<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>📖 로그인처치 전체66권 3번역본 성경 포털</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-color: #0b132b;
      --card-bg: rgba(28, 37, 65, 0.9);
      --card-border: rgba(255, 255, 255, 0.1);
      --accent-gold: #d4af37;
      --accent-green: #10b981;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, sans-serif; }
    body {
      background: linear-gradient(135deg, #0b132b 0%, #1c2541 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }
    .container { width: 100%; max-width: 500px; text-align: center; }
    .logo-badge {
      display: inline-flex; align-items: center; gap: 8px; background: rgba(16, 185, 129, 0.15); border: 1px solid var(--accent-green); color: #34d399; padding: 6px 18px; border-radius: 20px; font-size: 0.9rem; font-weight: 800; margin-bottom: 1.2rem;
    }
    .logo-badge img { height: 20px; vertical-align: middle; }
    h1 { font-size: 1.9rem; font-weight: 800; color: #ffffff; margin-bottom: 0.5rem; letter-spacing: -0.5px; }
    p.subtitle { color: var(--text-muted); font-size: 0.98rem; margin-bottom: 2rem; word-break: keep-all; }
    .cards-grid { display: flex; flex-direction: column; gap: 1.2rem; }
    .card {
      background: var(--card-bg); backdrop-filter: blur(12px); border: 1px solid var(--card-border); border-radius: 18px; padding: 1.5rem; text-decoration: none; color: var(--text-main); display: flex; align-items: center; justify-content: space-between; transition: all 0.25s ease; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
    }
    .card:hover, .card:active { transform: translateY(-3px); border-color: var(--accent-green); box-shadow: 0 12px 32px rgba(16, 185, 129, 0.25); }
    .card-info { display: flex; align-items: center; gap: 1rem; text-align: left; }
    .avatar { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 1.6rem; flex-shrink: 0; background: linear-gradient(135deg, #10b981 0%, #059669 100%); }
    .member-title { font-size: 1.2rem; font-weight: 700; color: #ffffff; margin-bottom: 2px; }
    .member-sub { font-size: 0.85rem; color: var(--text-muted); }
    .arrow-icon { font-size: 1.2rem; color: var(--accent-green); }
  </style>
</head>
<body>
  <div class="container">
    <div class="logo-badge"><img src="app_logo.png" alt="로그인처치" onerror="this.style.display='none'"> 📖 로그인처치 3번역본 성경</div>
    <h1>전체성경 3번역본 포털</h1>
    <p class="subtitle">권사님 성함 카드를 선택하시면 로그인처치 전용 전체성경 앱으로 연결됩니다.</p>

    <div class="cards-grid">
      <a href="./siwoong.html" class="card">
        <div class="card-info">
          <div class="avatar">🙏</div>
          <div>
            <div class="member-title">김시웅 권사님</div>
            <div class="member-sub">로그인처치 전체 66권 3번역본 성경통독일기장</div>
          </div>
        </div>
        <div class="arrow-icon">➔</div>
      </a>

      <a href="./hyunkyung.html" class="card">
        <div class="card-info">
          <div class="avatar">🌸</div>
          <div>
            <div class="member-title">최현경 권사님</div>
            <div class="member-sub">로그인처치 전체 66권 3번역본 성경통독일기장</div>
          </div>
        </div>
        <div class="arrow-icon">➔</div>
      </a>
    </div>
  </div>
</body>
</html>
